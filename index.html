<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Encoder Decoder</title>
<style>
body{font-family:Arial;background:#eff6ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:140px;padding:15px;box-sizing:border-box;border:1px solid #93c5fd;border-radius:8px;margin:10px 0}
button{background:#2563eb;color:white;padding:12px 18px;border:0;border-radius:7px;cursor:pointer;margin:4px}
#status{color:#1d4ed8}
</style>
</head>
<body>
<main>
<h1>URL Encoder Decoder</h1>
<p>Encode and decode URL components instantly.</p>
<textarea id="input" placeholder="Enter URL or text"></textarea>
<button onclick="convert(false)">Encode</button>
<button onclick="convert(true)">Decode</button>
<button onclick="clearText()">Clear</button>
<textarea id="output" readonly placeholder="Result"></textarea>
<button onclick="copyResult()">Copy Result</button>
<p id="status"></p>
</main>
<script>
function convert(decode){
 const text=document.getElementById("input").value;
 const output=document.getElementById("output");
 const status=document.getElementById("status");
 try{
  output.value=decode?decodeURIComponent(text):encodeURIComponent(text);
  status.textContent="Conversion successful!";
 }catch{
  output.value="";
  status.textContent="Invalid encoded text.";
 }
}
function clearText(){
 document.getElementById("input").value="";
 document.getElementById("output").value="";
 document.getElementById("status").textContent="";
}
async function copyResult(){
 try{
  await navigator.clipboard.writeText(document.getElementById("output").value);
  document.getElementById("status").textContent="Copied!";
 }catch{
  document.getElementById("status").textContent="Please copy manually.";
 }
}
</script>
</body>
</html>
