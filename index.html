<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Encoder Decoder</title>
<style>
body{font-family:Arial;background:#eff6ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:150px;padding:12px;box-sizing:border-box}
button{padding:12px 18px;margin:10px 5px 10px 0;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
#result{background:#dbeafe;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>URL Encoder & Decoder</h1>
<textarea id="input" placeholder="Enter text or URL..."></textarea>
<div>
<button onclick="encode()">Encode URL</button>
<button onclick="decode()">Decode URL</button>
<button onclick="clearAll()">Clear</button>
</div>
<h3>Result</h3>
<div id="result"></div>
<button onclick="copyResult()">Copy Result</button>
<p id="status"></p>
</main>
<script>
const input=document.getElementById("input");
const result=document.getElementById("result");
function encode(){
 if(!input.value){result.textContent="Enter some text first.";return;}
 result.textContent=encodeURIComponent(input.value);
}
function decode(){
 if(!input.value){result.textContent="Enter encoded text first.";return;}
 try{
  result.textContent=decodeURIComponent(input.value);
 }catch{
  result.textContent="Invalid encoded URL. Please check your input.";
 }
}
function clearAll(){
 input.value="";
 result.textContent="";
 document.getElementById("status").textContent="";
}
async function copyResult(){
 try{
  await navigator.clipboard.writeText(result.textContent);
  document.getElementById("status").textContent="Result copied!";
 }catch{
  document.getElementById("status").textContent="Please copy the result manually.";
 }
}
</script>
</body>
</html>
